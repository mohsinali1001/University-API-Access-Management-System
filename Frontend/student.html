<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal · University API Access Management System</title>
    <meta name="description" content="View your own academic profile and marks using your student API key.">
    <link rel="stylesheet" href="styles.css">
</head>

<body data-root="">
    <header id="navbar"></header>

    <main class="container">
        <div class="row row-between page-title">
            <div>
                <h1>My Academic Record</h1>
                <p>Showing the profile and marks that belong to your API key. Only your own data is visible.</p>
            </div>
            <button id="refreshBtn" class="btn btn-light btn-sm" type="button">
                <span>↻</span> Refresh
            </button>
        </div>

        <div id="studentContent">
            <div class="loading"><span class="spinner"></span> Loading your academic record…</div>
        </div>
    </main>

    <footer class="footer">Air University Islamabad, Kamra Campus · Full Stack Development Lab 07</footer>

    <script src="js/lib/jquery-3.7.1.min.js"></script>
    <script src="config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/student.js"></script>
</body>

</html>
