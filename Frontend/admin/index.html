<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel · University API Access</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body data-root="../">
    <header id="navbar"></header>

    <main class="container">
        <div class="page-title row row-between">
            <div>
                <h1>Admin Panel</h1>
                <p>Manage students, teachers and API keys.</p>
            </div>
            <button id="lockBtn" class="btn btn-light btn-sm hidden" type="button">🔒 Lock panel</button>
        </div>

        <!-- ============ Admin key gate ============ -->
        <section id="gate" class="card gate hidden">
            <h2 class="card-title">Administrator access</h2>
            <p class="hint" style="margin-bottom:1rem">Enter the predefined admin API key (<code>ADMIN_API_KEY</code> in
                the backend <code>.env</code>). It is kept only for this browser tab.</p>
            <form id="gateForm" autocomplete="off">
                <div class="form-group">
                    <label for="adminKeyInput" class="label">Admin API key</label>
                    <input id="adminKeyInput" class="input" type="password" required maxlength="64"
                        placeholder="admin_…" spellcheck="false">
                    <div id="gateError" class="form-error hidden"></div>
                </div>
                <button id="gateBtn" class="btn btn-primary" type="submit">Unlock</button>
            </form>
        </section>

        <!-- ============ Dashboard ============ -->
        <div id="panel" class="hidden">
            <div id="overview" class="grid grid-4"></div>

            <div class="tabs" role="tablist" style="margin-top:1.5rem">
                <button class="tab active" role="tab" data-tab="keys" type="button">API Keys</button>
                <button class="tab" role="tab" data-tab="students" type="button">Students</button>
                <button class="tab" role="tab" data-tab="teachers" type="button">Teachers</button>
            </div>

            <!-- Keys -->
            <section id="tab-keys" class="tab-panel stack">
                <div class="row row-between">
                    <div class="row">
                        <select id="filterStatus" class="input input-auto" aria-label="Filter by status">
                            <option value="">All statuses</option>
                            <option value="active">Active</option>
                            <option value="revoked">Revoked</option>
                        </select>
                        <select id="filterOwner" class="input input-auto" aria-label="Filter by owner type">
                            <option value="">Students &amp; teachers</option>
                            <option value="student">Students</option>
                            <option value="teacher">Teachers</option>
                        </select>
                    </div>
                    <div class="row">
                        <button id="refreshBtn" class="btn btn-light" type="button">Refresh</button>
                        <button id="newKeyBtn" class="btn btn-primary" type="button">+ Generate key</button>
                    </div>
                </div>
                <div id="keysTable"></div>
            </section>

            <!-- Students -->
            <section id="tab-students" class="tab-panel hidden">
                <div id="studentsTable"></div>
            </section>

            <!-- Teachers -->
            <section id="tab-teachers" class="tab-panel hidden">
                <div id="teachersTable"></div>
            </section>
        </div>
    </main>

    <footer class="footer">Air University Islamabad, Kamra Campus · Full Stack Development Lab 07</footer>

    <script src="../js/lib/jquery-3.7.1.min.js"></script>
    <script src="../config.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
